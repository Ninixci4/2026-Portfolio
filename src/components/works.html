<section id="works" class="section works-section">
    <span class="section-watermark" aria-hidden="true">Works</span>
    <div class="container">
        <header class="section-head" data-reveal>
            <h2 class="section-title">Featured works</h2>
            <p class="section-intro">A collection of products, sites, and studies that show how I think in interface, motion, and front-end craft.</p>
        </header>
        <div class="works-filters" data-reveal>
            <button class="filter-chip is-active" data-filter="all">All</button>
            <button class="filter-chip" data-filter="web">Web</button>
            <button class="filter-chip" data-filter="ui">UI/UX</button>
            <button class="filter-chip" data-filter="mobile">Mobile</button>
        </div>
        <div class="works-stack" id="worksGrid"></div>
    </div>
</section>

<div class="project-modal" id="projectModal" hidden>
    <div class="modal-shell">
        <div class="modal-visual">
            <div class="modal-gallery" id="modalGallery"></div>
        </div>
        <div class="modal-copy">
            <button class="close-modal" id="closeModal" aria-label="Close project"><i class="fas fa-times"></i></button>
            <p class="modal-kicker">Case study</p>
            <h3 class="modal-title" id="modalTitle"></h3>
            <p class="modal-description" id="modalDescription"></p>
            <div class="modal-tech">
                <h4>Tech stack</h4>
                <div class="tech-tags" id="modalTechStack"></div>
            </div>
            <div class="modal-actions">
                <a href="#" class="btn btn-primary" id="viewLiveSite" target="_blank" rel="noopener">View live site</a>
                <button class="btn btn-ghost" id="closeProject">Close project</button>
            </div>
        </div>
    </div>
</div>
