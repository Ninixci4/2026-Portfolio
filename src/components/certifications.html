<section id="certifications" class="section certifications-section">
    <span class="section-watermark" aria-hidden="true">Proof</span>
    <div class="container">
        <header class="section-head" data-reveal>
            <h2 class="section-title">Certifications &amp; seminars</h2>
            <p class="section-intro">A snapshot of continuous learning across design, cloud, leadership, and front-end.</p>
        </header>
        <div class="certifications-grid" id="certificationsGrid"></div>
    </div>
    <div class="certificate-modal" id="certificateModal" hidden>
        <div class="certificate-modal-content">
            <button class="close-certificate" id="closeCertificate" aria-label="Close certificate"><i class="fas fa-times"></i></button>
            <img src="" alt="Certificate" id="certificateImage">
        </div>
    </div>
</section>
