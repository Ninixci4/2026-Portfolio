<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App showcase — Nicia</title>
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="assets/img/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.css">
    <link rel="stylesheet" href="src/styles/style.css">
    <link rel="stylesheet" href="src/styles/phone-mockup.css">
    <link rel="stylesheet" href="src/styles/showcase.css">
</head>
<body>
    <a class="skip-link" href="#showcase">Skip to content</a>
    <div class="cursor" id="cursor" aria-hidden="true">
        <span class="cursor-dot"></span>
        <span class="cursor-ring"></span>
        <span class="cursor-label">view</span>
    </div>
    <div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>
    <div class="spatial-field" aria-hidden="true">
        <span class="orb orb-a"></span>
        <span class="orb orb-b"></span>
        <span class="orb orb-c"></span>
        <span class="grain"></span>
        <span class="spotlight" id="spotlight"></span>
    </div>

    <header class="header">
        <nav class="navbar">
            <div class="nav-capsule">
                <a class="nav-back" id="navBack" href="index.html#works">
                    <i class="fas fa-arrow-left" aria-hidden="true"></i>
                    <span>Back</span>
                </a>
                <a href="index.html#home" class="logo">&lt;Nicia.dev&gt;</a>
                <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="navLinks">
                    <span></span><span></span><span></span>
                </button>
                <div class="nav-links" id="navLinks">
                    <a href="index.html#home" class="nav-link">Home</a>
                    <a href="index.html#about" class="nav-link">About</a>
                    <a href="index.html#works" class="nav-link active">Works</a>
                    <a href="index.html#experience" class="nav-link">Experience</a>
                    <a href="index.html#certifications" class="nav-link">Certifications</a>
                    <a href="index.html#contact" class="nav-link">Contact</a>
                </div>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                        <defs>
                            <mask id="themeMoonMask">
                                <rect width="24" height="24" fill="#fff"/>
                                <circle cx="17.4" cy="8.6" r="5.6" fill="#000"/>
                            </mask>
                        </defs>
                        <circle cx="13" cy="12.4" r="8" fill="currentColor" mask="url(#themeMoonMask)"/>
                    </svg>
                    <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="4" fill="currentColor"/>
                        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <path d="M12 3v1.6M12 19.4V21M3 12h1.6M19.4 12H21M5.4 5.4l1.1 1.1M17.5 17.5l1.1 1.1M5.4 18.6l1.1-1.1M17.5 6.5l1.1-1.1"/>
                        </g>
                    </svg>
                </button>
            </div>
        </nav>
    </header>

    <main id="showcase">
        <section class="showcase-hero">
            <p class="showcase-kicker" id="showKicker">Mobile app</p>
            <h1 id="showTitle">App</h1>
            <p class="showcase-lead" id="showLead"></p>
            <div class="showcase-tech" id="showTech"></div>
            <div class="showcase-phone" id="showPhone"></div>
        </section>

        <section class="showcase-reel" id="showReel">
            <div class="showcase-sticky">
                <div class="showcase-reel-head">
                    <p class="section-index">UI screens</p>
                    <h2>Flip through the flow</h2>
                    <p class="reel-hint">Scroll to turn the deck · tap a card to see the reverse</p>
                </div>
                <div class="flip-stage">
                    <div class="flip-track" id="shotTrack"></div>
                </div>
                <div class="flip-meter" aria-hidden="true">
                    <span id="shotIndex">01</span>
                    <span class="flip-meter-line"></span>
                    <span id="shotTotal">10</span>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
    <script src="src/scripts/projects.js"></script>
    <script src="src/scripts/phone-mockup.js"></script>
    <script src="src/scripts/showcase.js"></script>
</body>
</html>
