<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nicia — UI/UX Designer & Front-end Developer</title>
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="assets/img/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/img/favicon.png">
    <meta name="description" content="Portfolio of Nichole Tricia R. Perez — UI/UX designer and front-end developer crafting spatial, interactive digital experiences.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.css">
    <link rel="stylesheet" href="src/styles/style.css">
    <link rel="stylesheet" href="src/styles/sections/home.css">
    <link rel="stylesheet" href="src/styles/sections/about.css">
    <link rel="stylesheet" href="src/styles/sections/works.css">
    <link rel="stylesheet" href="src/styles/phone-mockup.css">
    <link rel="stylesheet" href="src/styles/sections/experience.css">
    <link rel="stylesheet" href="src/styles/sections/certifications.css">
    <link rel="stylesheet" href="src/styles/sections/contact.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="preloader" id="preloader" aria-hidden="false">
        <div class="preloader-blob"></div>
        <p class="preloader-logo">Nicia</p>
        <span class="preloader-bar"></span>
    </div>

    <div class="cursor" id="cursor" aria-hidden="true">
        <span class="cursor-dot"></span>
        <span class="cursor-ring"></span>
        <span class="cursor-label">view</span>
    </div>

    <div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

    <div class="spatial-field" aria-hidden="true">
        <span class="orb orb-a"></span>
        <span class="orb orb-b"></span>
        <span class="orb orb-c"></span>
        <span class="orb orb-d"></span>
        <span class="grain"></span>
        <span class="spotlight" id="spotlight"></span>
    </div>

    <header class="header" id="siteHeader">
        <nav class="navbar">
            <div class="nav-capsule">
                <a href="#home" class="logo magnetic" data-cursor="logo">&lt;Nicia.dev&gt;</a>
                <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="navLinks">
                    <span></span><span></span><span></span>
                </button>
                <div class="nav-links" id="navLinks">
                    <a href="#home" class="nav-link active" data-magnetic>Home</a>
                    <a href="#about" class="nav-link" data-magnetic>About</a>
                    <a href="#works" class="nav-link" data-magnetic>Works</a>
                    <a href="#experience" class="nav-link" data-magnetic>Experience</a>
                    <a href="#certifications" class="nav-link" data-magnetic>Certifications</a>
                    <a href="#contact" class="nav-link" data-magnetic>Contact</a>
                </div>
                <button class="theme-toggle magnetic" id="themeToggle" aria-label="Toggle theme">
                    <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                        <defs>
                            <mask id="themeMoonMask">
                                <rect width="24" height="24" fill="#fff"/>
                                <circle cx="17.4" cy="8.6" r="5.6" fill="#000"/>
                            </mask>
                        </defs>
                        <circle cx="13" cy="12.4" r="8" fill="currentColor" mask="url(#themeMoonMask)"/>
                    </svg>
                    <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="4" fill="currentColor"/>
                        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <path d="M12 3v1.6M12 19.4V21M3 12h1.6M19.4 12H21M5.4 5.4l1.1 1.1M17.5 17.5l1.1 1.1M5.4 18.6l1.1-1.1M17.5 6.5l1.1-1.1"/>
                        </g>
                    </svg>
                </button>
            </div>
        </nav>
    </header>

    <main id="main">
        <div data-section="home"></div>
        <div data-section="about"></div>
        <div data-section="works"></div>
        <div data-section="experience"></div>
        <div data-section="certifications"></div>
        <div data-section="contact"></div>
    </main>

    <footer class="footer">
        <div class="container footer-grid">
            <a href="#home" class="footer-logo">Nicia.dev</a>
            <p class="footer-copy">I design the interface, then I code it.</p>
            <p class="footer-legal">&copy; 2026 Nichole Tricia R. Perez</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="src/scripts/inquiry-service.js"></script>
    <script src="src/scripts/section-loader.js"></script>
</body>
</html>
